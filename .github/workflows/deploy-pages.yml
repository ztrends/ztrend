name: Deploy ZTrend Store and Workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare separate experiences
        run: |
          mkdir -p site/shop site/zt-workspace-6mQ8
          cp storefront/index.html site/shop/index.html
          cp workspace/index.html site/zt-workspace-6mQ8/index.html
          cp index.html site/index.html
          cat > site/404.html <<'EOF'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZTrend</title><body style="font-family:system-ui;padding:40px;text-align:center"><h1>Page not found</h1><a href="./shop/">Open ZTrend Store</a></body></html>
          EOF
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
